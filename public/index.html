<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Well-Known Checker</title>
  <meta name="description" content="See which /.well-known/ URIs and root files (robots.txt, ads.txt, llms.txt…) a website serves, and learn what each one is for.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23256f5c'/><text x='16' y='22' font-family='monospace' font-size='15' font-weight='700' fill='white' text-anchor='middle'>.w</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="wrap">
    <h1><span class="dot">/.well-known/</span> checker</h1>
    <p class="lede">Check which <code>/.well-known/</code> URIs and root files a website publishes, and learn what each one does.</p>
    <form id="form" autocomplete="off">
      <input id="domain" name="domain" type="text" inputmode="url" spellcheck="false" placeholder="example.com" aria-label="Domain" required>
      <button id="go" type="submit">Check</button>
    </form>
    <p class="examples">Try:
      <a href="?d=github.com">github.com</a>
      <a href="?d=nytimes.com">nytimes.com</a>
      <a href="?d=mastodon.social">mastodon.social</a>
      <a href="?d=matrix.org">matrix.org</a>
    </p>
  </header>

  <main class="wrap">
    <section id="status" hidden>
      <div class="progress"><div id="bar"></div></div>
      <div class="summary">
        <div class="chips" id="chips"></div>
        <div class="tools">
          <label class="toggle"><input type="checkbox" id="showAll"> Show files it doesn't have</label>
          <button id="export" type="button" class="ghost" disabled>Export JSON</button>
        </div>
      </div>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
    <section id="results" aria-live="polite"></section>
  </main>

  <footer class="wrap">
    Checks <span id="count"></span> well-known URIs and root files
    (<a href="https://www.iana.org/assignments/well-known-uris/well-known-uris.xhtml" target="_blank" rel="noopener">IANA registry</a>).
    Responses aren't stored.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
